<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETA - Validación de Usuarios</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Rutas de CSS de contingencia -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="./style.css">

  <!-- Estilos de Rescate Directo (Asegura el diseño aunque falle la ruta del CSS) -->
  <style>
    body.login-body {
      background-color: #070a12;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    .btn-back {
      position: absolute;
      top: 25px;
      left: 5%;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      transition: all 0.3s ease;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .login-logo-glow {
      max-height: 80px;
      width: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0px 0px 12px rgba(0, 212, 255, 0.7));
    }

    .login-header h2 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .login-header p {
      color: #a0aec0;
      font-size: 0.85rem;
      margin-bottom: 25px;
    }

    .text-gradient {
      background: linear-gradient(135deg, #00d4ff, #0055ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .input-group input, 
    .input-group select {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
    }

    .input-group select option {
      background: #070a12;
      color: #ffffff;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0055ff, #00d4ff);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
    }

    .register-link-container {
      margin-top: 20px;
      font-size: 0.88rem;
      color: #a0aec0;
    }

    .highlight-link {
      color: #00d4ff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body class="login-body">

  <!-- Botón para volver al Inicio -->
  <a href="index.html" class="btn-back">
    <i class="fa-solid fa-arrow-left"></i> Volver al Inicio
  </a>

  <!-- Tarjeta de Login Centrada -->
  <div class="login-container">
    <div class="login-card">
      
      <!-- Encabezado y Logo Limitado -->
      <div class="login-header">
        <a href="index.html">
          <img src="img/logo_reta.png" alt="RETA Logo" class="login-logo-glow" style="max-height: 80px !important; width: auto !important;">
        </a>
        <h2>Validación de <span class="text-gradient">Usuarios</span></h2>
        <p>Ingresa tus credenciales para acceder al panel</p>
      </div>

      <!-- Formulario de Acceso -->
      <form id="loginForm">
        
        <div class="input-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Correo Electrónico</label>
          <input type="email" id="email" placeholder="usuario@reta.app" required>
        </div>

        <div class="input-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="input-group">
          <label for="role"><i class="fa-solid fa-user-shield"></i> Rol de Acceso</label>
          <select id="role" required>
            <option value="" disabled selected>Selecciona tu rol</option>
            <option value="usuario">Usuario / Jugador</option>
            <option value="master">Master</option>
            <option value="referee">Árbitro / Referee</option>
            <option value="supervisor">Supervisor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <button type="submit" class="btn-login">
          Ingresar al Sistema <i class="fa-solid fa-right-to-bracket"></i>
        </button>

      </form>

      <div class="register-link-container">
        <p>¿No tienes usuario? <a href="#" class="highlight-link">Regístrate aquí</a></p>
      </div>

      <div id="loginMessage" class="login-message" style="margin-top: 15px; font-weight: 600;"></div>

    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
