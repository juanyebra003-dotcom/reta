<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RETA - Panel Administrador de Liga</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .dashboard-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--glass-border, rgba(255,255,255,0.1));
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      backdrop-filter: blur(10px);
    }

    .kpi-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid var(--cyan-neon, #00d4ff);
      color: var(--cyan-neon, #00d4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .kpi-info h3 {
      font-size: 1.6rem;
      color: #fff;
      margin: 0;
      font-weight: 700;
    }

    .kpi-info p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin: 0;
    }

    .league-management-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--glass-border, rgba(255,255,255,0.1));
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      backdrop-filter: blur(12px);
    }

    .league-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 18px;
      margin-bottom: 20px;
    }

    .league-brand-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .league-badge-img {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--cyan-neon, #00d4ff);
      object-fit: cover;
    }

    .league-title-box h3 {
      font-size: 1.25rem;
      color: #fff;
      margin: 0;
    }

    .league-meta {
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      gap: 15px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .league-actions-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action-primary {
      background: var(--cyan-neon, #00d4ff);
      color: #000;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-action-primary:hover {
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
      transform: translateY(-2px);
    }

    .tournaments-dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .tournament-dash-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--cyan-neon, #00d4ff);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .td-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .td-head h4 {
      font-size: 0.95rem;
      color: #fff;
      margin: 0;
    }

    .td-badge {
      font-size: 0.7rem;
      background: rgba(0, 212, 255, 0.15);
      color: var(--cyan-neon, #00d4ff);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 212, 255, 0.3);
    }

    .td-info {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .td-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }

    .btn-link-teams {
      color: var(--cyan-neon, #00d4ff);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .loading-state, .empty-state {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
  </style>
</head>
<body class="login-body">

  <a href="index.html" class="btn-back">
    <i class="fa-solid fa-arrow-left"></i> Salir al Inicio
  </a>

  <div class="dashboard-container">
    
    <!-- Encabezado -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
      <div>
        <h2 style="color: #fff; margin: 0;">Panel de <span class="text-gradient">Administración de Ligas</span></h2>
        <p style="color: #94a3b8; margin: 4px 0 0 0; font-size: 0.88rem;">Sincronizado en tiempo real con Supabase</p>
      </div>

      <a href="liga_registrar.html" class="btn-action-primary">
        <i class="fa-solid fa-plus-circle"></i> Registrar Nueva Liga
      </a>
    </div>

    <!-- 1. RESUMEN DE MÉTRICAS (KPIs) -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon"><i class="fa-solid fa-trophy"></i></div>
        <div class="kpi-info">
          <h3 id="kpiLeagues">0</h3>
          <p>Ligas Registradas</p>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon"><i class="fa-solid fa-layer-group"></i></div>
        <div class="kpi-info">
          <h3 id="kpiTournaments">0</h3>
          <p>Torneos Activos</p>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="kpi-info">
          <h3 id="kpiTeams">0</h3>
          <p>Equipos Inscritos</p>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon"><i class="fa-solid fa-users"></i></div>
        <div class="kpi-info">
          <h3 id="kpiPlayers">0</h3>
          <p>Jugadores Registrados</p>
        </div>
      </div>
    </div>

    <!-- 2. CONTENEDOR DINÁMICO DE LIGAS -->
    <div id="leaguesContainer">
      <div class="loading-state">
        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: #00d4ff;"></i>
        <p style="margin-top: 10px;">Cargando ligas y torneos desde Supabase...</p>
      </div>
    </div>

  </div>

  <script>
    // Inicialización Autosostenible de Supabase con tus credenciales
    const SUPABASE_URL = 'https://ymgsrqsgcexilgatpsew.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltZ3NycXNnY2V4aWxnYXRwc2V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NTQ2MDUsImV4cCI6MjEwMDIzMDYwNX0.aqPRm3TJvoB0xn8V968la9wY26GtWj1iXYmHAhGvq-4'; 

    // Instancia Global
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', () => {
      loadDashboardData();
    });

    async function loadDashboardData() {
      const leaguesContainer = document.getElementById('leaguesContainer');

      try {
        // 1. Consulta independiente de Ligas
        const { data: ligas, error: leaguesErr } = await _supabase
          .from('ligas')
          .select('*')
          .order('creado_en', { ascending: false });

        if (leaguesErr) throw leaguesErr;

        // 2. Consulta independiente de Torneos (Evita dependencias de relación en PostgREST)
        const { data: torneos, error: torneosErr } = await _supabase
          .from('liga_torneo')
          .select('*');

        if (torneosErr) console.warn("Aviso al consultar torneos:", torneosErr);

        // 3. Consulta de conteos totales de Equipos y Jugadores
        const { count: teamsCount } = await _supabase.from('equipos').select('*', { count: 'exact', head: true });
        const { count: playersCount } = await _supabase.from('jugadores').select('*', { count: 'exact', head: true });

        // 4. Mapeo en memoria de Torneos dentro de sus Ligas correspondientes
        const listLigas = (ligas || []).map(liga => {
          const listTorneos = (torneos || []).filter(t => t.liga_id === liga.id);
          return { ...liga, liga_torneo: listTorneos };
        });

        // 5. Actualización de KPIs
        const totalLigas = listLigas.length;
        const totalTorneos = (torneos || []).length;

        document.getElementById('kpiLeagues').textContent = totalLigas;
        document.getElementById('kpiTournaments').textContent = totalTorneos;
        document.getElementById('kpiTeams').textContent = teamsCount || 0;
        document.getElementById('kpiPlayers').textContent = playersCount || 0;

        // 6. Estado Vacío (Empty State)
        if (listLigas.length === 0) {
          leaguesContainer.innerHTML = `
            <div class="glass-card empty-state">
              <i class="fa-solid fa-folder-open fa-3x" style="color: #64748b; margin-bottom: 15px;"></i>
              <h3>No hay ligas registradas aún</h3>
              <p>Comienza registrando tu primera liga con sus torneos correspondientes.</p>
              <a href="liga_registrar.html" class="btn-action-primary" style="display:inline-flex; margin-top:15px;">
                <i class="fa-solid fa-plus-circle"></i> Registrar Mi Primera Liga
              </a>
            </div>
          `;
          return;
        }

        // 7. Renderizado Dinámico de las Ligas y Torneos
        leaguesContainer.innerHTML = listLigas.map(liga => `
          <div class="league-management-card">
            <div class="league-card-header">
              <div class="league-brand-info">
                <img src="${liga.logo_url || 'img/logo_reta.png'}" alt="Logo Liga" class="league-badge-img">
                <div class="league-title-box">
                  <h3>${liga.nombre_liga} <span style="font-size:0.75rem; color:#00d4ff; font-weight:normal;">(${liga.clave_liga})</span></h3>
                  <div class="league-meta">
                    <span><i class="fa-solid fa-map-location-dot"></i> ${liga.municipio}, ${liga.estado}</span>
                    <span><i class="fa-solid fa-futbol"></i> ${liga.disciplina || 'Fútbol'}</span>
                    <span><i class="fa-solid fa-phone"></i> ${liga.telefono_liga || 'N/A'}</span>
                  </div>
                </div>
              </div>

              <div class="league-actions-bar">
                <a href="equipo_registrar.html?liga_id=${liga.id}" class="btn-action-primary">
                  <i class="fa-solid fa-shield-plus"></i> Registrar Equipo
                </a>
              </div>
            </div>

            <h4 style="color:#fff; font-size:0.9rem; margin-bottom:15px;">
              <i class="fa-solid fa-sitemap style-cyan"></i> Torneos Configurados (${liga.liga_torneo ? liga.liga_torneo.length : 0})
            </h4>

            <div class="tournaments-dashboard-grid">
              ${
                liga.liga_torneo && liga.liga_torneo.length > 0 
                ? liga.liga_torneo.map(t => `
                    <div class="tournament-dash-card">
                      <div>
                        <div class="td-head">
                          <h4>${t.nombre_torneo || 'Torneo Sin Nombre'}</h4>
                          <span class="td-badge">${t.categoria || 'Libre'}</span>
                        </div>
                        <div class="td-info">
                          <span><i class="fa-solid fa-venus-mars"></i> Rama: ${t.rama || 'General'}</span><br>
                          <span><i class="fa-solid fa-shield-halved"></i> ${t.equipos_proyectados || 12} Equipos Esperados</span>
                        </div>
                      </div>
                      <div class="td-actions">
                        <a href="equipo_registrar.html?liga_torneo_id=${t.id}" class="btn-link-teams">
                          <i class="fa-solid fa-user-plus"></i> Alta de Equipo
                        </a>
                      </div>
                    </div>
                  `).join('')
                : `<p style="color:#64748b; font-size:0.85rem;">No hay torneos asociados a esta liga.</p>`
              }
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error("Error al cargar datos en el panel:", err);
        leaguesContainer.innerHTML = `
          <div class="glass-card empty-state" style="border-color: #ff4d4d;">
            <i class="fa-solid fa-triangle-exclamation fa-3x" style="color: #ff4d4d; margin-bottom: 15px;"></i>
            <h3>Error al conectar con Supabase</h3>
            <p>${err.message || JSON.stringify(err)}</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
